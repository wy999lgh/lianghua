# 网格交易量化策略系统 - 主配置文件
# 所有路径均相对于项目根目录

# ===========================================
# 数据库配置
# ===========================================
database:
  # 默认数据库类型：postgres / sqlite
  backend: "sqlite"
  # PostgreSQL 连接参数（密码读取顺序：环境变量优先，其次配置文件回退）
  # 生产环境请勿在此填写密码，统一通过 .env 或环境变量注入
  postgres:
    host: "${POSTGRES_HOST:-localhost}"
    port: "${POSTGRES_PORT:-5432}"
    database: "${POSTGRES_DB:-postgres}"
    user: "${POSTGRES_USER:-postgres}"
    password: ""
    password_env: "PGPASSWORD"
  # 行情数据库（存储股票/ETF历史数据）
  stock_data_db: "data/stock_data.db"
  # 策略数据库（存储策略配置、回测结果、交易记录）
  trading_system_db: "data/grid_trading_system.db"

# ===========================================
# 数据获取配置
# ===========================================
data_fetcher:
  # 重试次数
  retry_count: 3
  # 重试间隔（秒）
  retry_delay: 1
  # AKShare数据字段映射
  column_mapping:
    日期: "date"
    开盘: "open"
    收盘: "close"
    最高: "high"
    最低: "low"
    成交量: "volume"
    成交额: "amount"
    振幅: "amplitude"
    涨跌幅: "pct_chg"
    涨跌额: "change"
    换手率: "turnover"

# ===========================================
# 交易配置
# ===========================================
trading:
  # 手续费配置
  commission:
    # ETF佣金率（万分之一，即0.10‰）
    rate: 0.0001
    # 最低手续费（元）
    min_fee: 0.1
  
  # 滑点配置
  slippage:
    # 滑点率（买入略低，卖出略高）
    rate: 0.001
    # 是否启用滑点
    enabled: true

# ===========================================
# 网格策略默认参数
# ===========================================
grid_default:
  # 买入步长（每下跌1%买入）
  buy_percent: 0.01
  # 卖出步长（每上涨1%卖出）
  sell_percent: 0.01
  # 下跌买入量（股）
  buy_amount: 100
  # 上涨卖出量（股）
  sell_amount: 100
  # 默认上方网格数量
  upper_count: 100
  # 默认下方网格数量
  lower_count: 100
  # 最大持仓限制（股）
  max_position: 10000
  # 最小底仓（股）
  min_position: 1000
  # 基准价更新方式：trigger_price（触发价）/ trade_price（成交价）
  update_method: "trigger_price"

# ===========================================
# API服务配置
# ===========================================
api:
  # 服务器地址
  host: "0.0.0.0"
  # 服务端口
  port: 8000
  # 是否开启调试模式
  debug: false
  # API标题
  title: "网格交易量化策略系统API"
  # API版本
  version: "1.0.0"
  # CORS允许的来源（生产环境应设置具体域名）
  cors_origins:
    - "*"

# ===========================================
# 日志配置
# ===========================================
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # 是否输出到控制台
  console: true
  # 是否输出到文件
  file: true
  # 日志文件路径
  file_path: "logs/trading.log"
  # 日志文件最大大小（MB）
  max_size: 10
  # 保留的日志文件数量
  backup_count: 5

# ===========================================
# 消息通知配置
# ===========================================
notification:
  # 是否启用通知
  enabled: false
  # 企业微信机器人 Webhook URL
  wechat_webhook_url: ""
  # 同类消息最小间隔（秒）
  rate_limit: 60
  # ERROR 日志自动通知
  notify_on_error: true
  # 交易信号自动通知
  notify_on_trade: true

# ===========================================
# 任务调度配置
# ===========================================
scheduler:
  # 是否启用任务调度
  enabled: false
  # 定时任务列表
  tasks:
    update_stock_data:
      schedule: "every day at 18:00"
      enabled: true
    daily_report:
      schedule: "every day at 20:00"
      enabled: true
